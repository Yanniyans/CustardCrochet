<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustardCrochet</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #fdfbf7; color: #333; }
        
        /* Header & Hopper */
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        select, button, textarea { padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
        select { flex: 1; }
        
        /* Delete Button */
        #delete-button { background-color: #ff4d4d; color: white; border: none; cursor: pointer; font-weight: bold; width: 100px; }
        #delete-button:hover { background-color: #e60000; }
        
        /* Import Section */
        .import-section { width: 100%; max-width: 400px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .toggle-btn { background-color: #e0e0e0; border: none; cursor: pointer; color: #333; }
        .toggle-btn:hover { background-color: #ccc; }
        #import-tools { display: flex; flex-direction: column; gap: 10px; }
        textarea { resize: vertical; font-family: monospace; font-size: 14px; }
        .import-btn { background-color: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; }
        .import-btn:hover { background-color: #45a049; }
        
        /* Main Instruction Display */
        .instruction-box { width: 100%; max-width: 400px; background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; margin-bottom: 30px; box-sizing: border-box; }
        #current-instruction { font-size: 24px; font-weight: bold; margin: 0; line-height: 1.4; color: #222; }
        
        /* Main Buttons */
        .button-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        #next-button { width: 100%; height: 150px; font-size: 28px; font-weight: bold; background-color: #ff9800; color: white; border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 8px 15px rgba(255, 152, 0, 0.4); transition: background-color 0.2s; }
        #next-button:active { background-color: #e68a00; transform: translateY(2px); box-shadow: none; }
        #next-button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
        
        #undo-button { width: 100%; padding: 15px; font-size: 18px; background-color: #f0f0f0; color: #555; border: 1px solid #ccc; border-radius: 12px; cursor: pointer; }
        #undo-button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Pattern Overview */
        .all-instructions { width: 100%; max-width: 400px; margin-top: 30px; text-align: left; }
        .done { text-decoration: line-through; color: #888; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <select id="project-hopper" onchange="switchProject()"></select>
        <button id="delete-button" onclick="deleteProject()">🗑️ Delete</button>
    </header>

    <div class="import-section">
        <button class="toggle-btn" onclick="toggleImport()">➕ Add New Pattern</button>
        <div id="import-tools" class="hidden">
            <textarea id="json-input" rows="4" placeholder="Paste your generated pattern JSON here..."></textarea>
            <button class="import-btn" onclick="importJson()">Import Pattern</button>
        </div>
    </div>

    <div class="instruction-box">
        <p id="current-instruction">Fetching your projects from Google Sheets...</p>
    </div>

    <div class="button-group">
        <button id="next-button" onclick="nextRow()" disabled>Next Row</button>
        <button id="undo-button" onclick="undoRow()">Undo Previous Row</button>
    </div>

    <div class="all-instructions">
        <h3>Pattern Overview</h3>
        <ul id="instruction-list"></ul>
    </div>

    <script>
        // PASTE YOUR GOOGLE SHEETS WEB APP URL HERE
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzHYABF4BOo91BV9P2Fyco32kzdXKqn_ZJy3rzbik_Vqrm2_3PWVVT-kNEiZxeoVLAmOg/exec";

        let allProjects = [];
        let allProgress = {};
        let activeProject = null;
        let currentRowIndex = 0;
        let historyStack = [];

        async function initApp() {
            try {
                const response = await fetch(GOOGLE_WEB_APP_URL);
                const data = await response.json();
                allProjects = data.projects;
                allProgress = data.progress;
                populateHopper();
            } catch (error) {
                document.getElementById("current-instruction").innerText = "Could not connect to Google Sheets.";
            }
        }

        function populateHopper() {
            const hopper = document.getElementById("project-hopper");
            hopper.innerHTML = "";
            if (allProjects.length === 0) {
                hopper.innerHTML = "<option>No Projects Found</option>";
                document.getElementById("current-instruction").innerText = "Tap 'Add New Pattern' to get started!";
                document.getElementById("delete-button").disabled = true;
                return;
            }
            document.getElementById("delete-button").disabled = false;
            allProjects.forEach(proj => {
                let opt = document.createElement("option");
                opt.value = proj.projectId;
                opt.innerText = proj.projectName;
                hopper.appendChild(opt);
            });
            switchProject(); 
        }

        function switchProject() {
            const hopper = document.getElementById("project-hopper");
            activeProject = allProjects.find(p => p.projectId === hopper.value);
            if (!activeProject) return;
            currentRowIndex = allProgress[activeProject.projectId] || 0;
            historyStack = []; 
            document.getElementById("next-button").disabled = false;
            renderUI();
        }

        function renderUI() {
            if (!activeProject) return;
            
            const currentInst = activeProject.instructions[currentRowIndex] || "🎉 Project Complete!";
            document.getElementById("current-instruction").innerText = currentInst;

            const listEl = document.getElementById("instruction-list");
            listEl.innerHTML = "";
            activeProject.instructions.forEach((inst, index) => {
                const li = document.createElement("li");
                li.innerText = inst;
                if (index < currentRowIndex) li.className = "done";
                listEl.appendChild(li);
            });

            document.getElementById("undo-button").disabled = (historyStack.length === 0);
        }

        async function nextRow() {
            if (currentRowIndex < activeProject.instructions.length) {
                const button = document.getElementById("next-button");
                button.innerText = "Saving...";
                button.disabled = true;

                try {
                    const response = await fetch(GOOGLE_WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "updateProgress", projectId: activeProject.projectId, newRow: currentRowIndex + 1 })
                    });
                    const result = await response.json();
                    if (result.status === "saved") {
                        historyStack.push(currentRowIndex);
                        currentRowIndex++;
                        allProgress[activeProject.projectId] = currentRowIndex;
                        renderUI();
                        button.innerText = "Next Row";
                    }
                } catch (error) {
                    button.innerText = "Error! Try Again.";
                } finally {
                    button.disabled = false;
                    setTimeout(() => { if (button.innerText === "Error! Try Again.") button.innerText = "Next Row"; }, 3000);
                }
            }
        }

        async function undoRow() {
            if (historyStack.length > 0) {
                const prevRowIndex = historyStack.pop();
                const button = document.getElementById("next-button");
                button.innerText = "Undoing...";
                button.disabled = true;

                try {
                    await fetch(GOOGLE_WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "updateProgress", projectId: activeProject.projectId, newRow: prevRowIndex })
                    });
                    currentRowIndex = prevRowIndex;
                    allProgress[activeProject.projectId] = currentRowIndex;
                    renderUI();
                } catch (error) {
                    historyStack.push(prevRowIndex); 
                } finally {
                    button.innerText = "Next Row";
                    button.disabled = false;
                }
            }
        }

        // Toggle the JSON Input Box
        function toggleImport() {
            const tools = document.getElementById("import-tools");
            tools.classList.toggle("hidden");
        }

        async function importJson() {
            const inputField = document.getElementById("json-input");
            const jsonText = inputField.value.trim();
            const button = document.querySelector(".import-btn");

            if (!jsonText) { alert("Please paste the JSON code first!"); return; }

            try {
                const newProject = JSON.parse(jsonText);
                button.innerText = "Importing...";
                button.disabled = true;

                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "addProject", ...newProject })
                });
                
                const result = await response.json();
                if(result.status === "project_added") {
                    allProjects.push(newProject);
                    populateHopper();
                    document.getElementById("project-hopper").value = newProject.projectId;
                    switchProject();
                    inputField.value = ""; 
                    toggleImport(); // Hide the box after successful import
                }
            } catch (err) {
                alert("Oops! The text you pasted isn't valid JSON, or there was a connection error.");
            } finally {
                button.innerText = "Import Pattern";
                button.disabled = false;
            }
        }

        // Delete Project Logic
        async function deleteProject() {
            if (!activeProject) return;
            
            const confirmDelete = confirm(`Are you sure you want to permanently delete "${activeProject.projectName}"?`);
            if (!confirmDelete) return;

            const button = document.getElementById("delete-button");
            button.innerText = "Deleting...";
            button.disabled = true;

            try {
                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "deleteProject", projectId: activeProject.projectId })
                });
                
                const result = await response.json();
                if(result.status === "project_deleted") {
                    allProjects = allProjects.filter(p => p.projectId !== activeProject.projectId);
                    delete allProgress[activeProject.projectId];
                    populateHopper(); 
                }
            } catch (err) {
                alert("Failed to delete the project. Please check your connection.");
            } finally {
                button.innerText = "🗑️ Delete";
                button.disabled = false;
            }
        }

        initApp();
    </script>
</body>
</html>
