<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CustardCrochet</title>
  <style>
    :root {
      --custard: #FFF9E6; /* Pale custard yellow */
      --caramel: #D49A6A; /* Medium caramel brown */
      --chocolate: #4A2E1B; /* Dark chocolate brown */
      --mustard: #E6B325; /* Bright mustard yellow */
      --orange: #E87A5D; /* Warm orange */
    }
    body {
      background-color: var(--custard);
      color: var(--chocolate);
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: var(--chocolate);
      font-weight: bold;
    }
    .import-section, .viewer-modal {
      margin-top: 20px;
      padding: 15px;
      border: 2px solid var(--caramel);
      background-color: white;
      border-radius: 8px;
    }
    #done-btn {
      background-color: var(--orange);
      color: white;
      font-size: 24px;
      padding: 20px 40px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 6px 0 var(--caramel);
      cursor: pointer;
      margin: 20px 0;
      transition: all 0.1s;
    }
    #done-btn:active {
      box-shadow: 0 0 0 var(--caramel);
      transform: translateY(6px);
      background-color: var(--mustard);
    }
    .secondary-btn {
      background-color: var(--caramel);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    #current-instruction { font-size: 24px; font-weight: bold; margin: 20px 0; }
    #next-instruction { font-size: 14px; opacity: 0.8; }
    
    /* Pattern Viewer Modal */
    #viewer-modal { display: none; text-align: left; max-height: 300px; overflow-y: auto; }
    .viewer-row { padding: 8px; cursor: pointer; border-bottom: 1px solid var(--caramel); }
    .row-done { color: var(--caramel); text-decoration: line-through; }
    .row-current { background-color: var(--mustard); font-weight: bold; color: var(--chocolate); }
    .row-future { color: var(--chocolate); }
  </style>
</head>
<body>

  <h1>CustardCrochet</h1>
  
  <select id="projectSelect" class="secondary-btn"></select>

  <div id="import-section" class="import-section">
    <h3 style="margin-top:0;">Add New Project</h3>
    <textarea id="json-input" placeholder="Paste Gemini's JSON here..." style="width: 100%; height: 80px; margin-bottom:10px;"></textarea>
    <button id="import-btn" class="secondary-btn" style="background-color: var(--mustard); color: var(--chocolate);">Import to App</button>
  </div>

  <div>
    <div id="current-instruction">Loading...</div>
    <div id="next-instruction"></div>
  </div>

  <button id="done-btn">NEXT ROW</button>
  
  <div>
    <button id="undo-btn" class="secondary-btn">Undo</button>
    <button id="view-btn" class="secondary-btn">View Pattern</button>
  </div>

  <div id="viewer-modal" class="viewer-modal">
    <h3>Pattern Viewer</h3>
    <div id="viewer-content"></div>
    <button id="close-viewer" class="secondary-btn" style="width:100%; margin-top:10px;">Close</button>
  </div>

  <script>
    // --- IMPORTANT: PASTE YOUR WEB APP URL HERE ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwug2NJVIlZupFqGzINmFXo0A3LWrKfW-8uVbwUXXYjOEEpyVKwfonJZrazS8MQYE8psw/exec"; 

    let projectsDatabase = JSON.parse(localStorage.getItem('cachedProjects')) || [];
    let currentProjectIndex = 0;
    let currentRow = 0;

    // Elements
    const projectSelect = document.getElementById('projectSelect');
    const currentInstEl = document.getElementById('current-instruction');
    const nextInstEl = document.getElementById('next-instruction');
    const viewerModal = document.getElementById('viewer-modal');
    const viewerContent = document.getElementById('viewer-content');

    // Initialization
    function init() {
      fetchProjects();
      renderDropdown();
    }

    function fetchProjects() {
      if(!WEB_APP_URL.includes("script.google.com")) return; // Skip if no URL
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            projectsDatabase = data;
            localStorage.setItem('cachedProjects', JSON.stringify(projectsDatabase));
            renderDropdown();
          }
        }).catch(err => console.log("Offline mode active."));
    }

    function renderDropdown() {
      projectSelect.innerHTML = "";
      if (projectsDatabase.length === 0) {
        currentInstEl.innerText = "No projects yet. Import one below!";
        nextInstEl.innerText = "";
        return;
      }
      projectsDatabase.forEach((proj, index) => {
        let option = document.createElement('option');
        option.value = index;
        option.innerText = proj.name || `Project ${index + 1}`;
        projectSelect.appendChild(option);
      });
      loadProject(0);
    }

    function loadProject(index) {
      if(projectsDatabase.length === 0) return;
      currentProjectIndex = index;
      const proj = projectsDatabase[currentProjectIndex];
      // Load progress from local storage
      currentRow = parseInt(localStorage.getItem(`progress_${proj.id}`)) || 0;
      updateUI();
    }

    function updateUI() {
      const proj = projectsDatabase[currentProjectIndex];
      if (!proj || !proj.pattern) return;

      if (currentRow >= proj.pattern.length) {
        currentInstEl.innerText = "Project Complete! 🎉";
        nextInstEl.innerText = "";
      } else {
        currentInstEl.innerText = proj.pattern[currentRow];
        nextInstEl.innerText = (currentRow + 1 < proj.pattern.length) ? "Next: " + proj.pattern[currentRow + 1] : "";
      }
      renderViewer();
    }

    function saveProgress(row) {
      const proj = projectsDatabase[currentProjectIndex];
      if (!proj) return;
      currentRow = row;
      localStorage.setItem(`progress_${proj.id}`, currentRow);
      updateUI();

      // Background sync to Google Sheets
      if(WEB_APP_URL.includes("script.google.com")) {
        fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: "updateProgress",
            projectId: proj.id,
            currentRow: currentRow
          })
        }).catch(e => console.log("Saved locally."));
      }
    }

    // Event Listeners
    projectSelect.addEventListener('change', (e) => loadProject(e.target.value));

    document.getElementById('done-btn').addEventListener('click', () => {
      const proj = projectsDatabase[currentProjectIndex];
      if (proj && currentRow < proj.pattern.length) saveProgress(currentRow + 1);
    });

    document.getElementById('undo-btn').addEventListener('click', () => {
      if (currentRow > 0) saveProgress(currentRow - 1);
    });

    // Pattern Viewer Logic
    document.getElementById('view-btn').addEventListener('click', () => viewerModal.style.display = 'block');
    document.getElementById('close-viewer').addEventListener('click', () => viewerModal.style.display = 'none');

    function renderViewer() {
      const proj = projectsDatabase[currentProjectIndex];
      if (!proj) return;
      viewerContent.innerHTML = "";
      proj.pattern.forEach((inst, index) => {
        let div = document.createElement('div');
        div.innerText = `${index + 1}. ${inst}`;
        div.className = "viewer-row ";
        
        if (index < currentRow) div.className += "row-done";
        else if (index === currentRow) div.className += "row-current";
        else div.className += "row-future";

        div.onclick = () => {
          saveProgress(index);
          viewerModal.style.display = 'none';
        };
        viewerContent.appendChild(div);
      });
    }

    // Import Logic
    document.getElementById('import-btn').addEventListener('click', () => {
      const jsonText = document.getElementById('json-input').value;
      try {
        const newProject = JSON.parse(jsonText);
        projectsDatabase.push(newProject);
        localStorage.setItem('cachedProjects', JSON.stringify(projectsDatabase));
        
        if(WEB_APP_URL.includes("script.google.com")) {
          fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: "addProject",
              projectId: newProject.id || Date.now().toString(),
              projectName: newProject.name || "New Project",
              patternData: newProject
            })
          });
        }
        
        alert("Project imported successfully!");
        document.getElementById('json-input').value = "";
        renderDropdown();
      } catch (error) {
        alert("Oops! Make sure you pasted the exact JSON block.");
      }
    });

    init();
  </script>
</body>
</html>
