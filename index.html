<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustardCrochet</title>
    <style>
        :root {
            --custard: #FDF9E0;
            --caramel: #D68C45;
            --chocolate: #4A2E1B;
            --mustard: #F4C430;
            --orange: #E87A5D;
        }
        body {
            background-color: var(--custard);
            color: var(--chocolate);
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: var(--chocolate);
            font-weight: bold;
        }
        /* Top Navigation / UI */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid var(--caramel);
            cursor: pointer;
        }
        #toggleImportBtn {
            background-color: var(--caramel);
            color: white;
            border: none;
        }
        #deleteBtn {
            background-color: #d9534f;
            color: white;
            border: none;
            margin-left: 10px;
        }
        /* Import Section */
        #importSection {
            display: none;
            background-color: white;
            border: 2px solid var(--caramel);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
        }
        /* Pattern Display */
        #patternDisplay {
            margin: 30px 0;
            padding: 20px;
            border: 2px solid var(--caramel);
            border-radius: 8px;
            background-color: white;
        }
        .current-instruction {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .next-instruction {
            font-size: 14px;
            color: gray;
        }
        .notes {
            font-size: 12px;
            font-style: italic;
            margin-top: 10px;
        }
        /* Giant Done Button */
        #doneBtn {
            background-color: var(--orange);
            color: white;
            font-size: 24px;
            padding: 20px 40px;
            border: none;
            border-bottom: 5px solid var(--caramel);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            transition: all 0.1s;
        }
        #doneBtn:active {
            background-color: var(--mustard);
            border-bottom: 2px solid var(--caramel);
            transform: translateY(3px);
        }
        /* Secondary Buttons */
        .action-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        #statusText {
            font-style: italic;
            color: var(--caramel);
            height: 20px;
        }
        /* Viewer Popup */
        #viewerPopup {
            display: none;
            position: fixed;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            background-color: var(--custard);
            border: 4px solid var(--caramel);
            border-radius: 12px;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);
        }
        .viewer-row {
            padding: 10px;
            border-bottom: 1px solid var(--caramel);
            cursor: pointer;
            text-align: left;
        }
        .viewer-row.finished { color: var(--caramel); }
        .viewer-row.current { background-color: var(--mustard); color: var(--chocolate); font-weight: bold; }
        .viewer-row.future { color: var(--chocolate); }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>CustardCrochet</h1>
        <button id="toggleImportBtn">+ New Pattern</button>
    </div>

    <div id="importSection">
        <textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>
        <button id="importBtn" style="background-color: var(--mustard);">Import</button>
    </div>

    <div>
        <select id="projectSelect"></select>
        <button id="deleteBtn">🗑️ Delete</button>
    </div>
    <div id="statusText"></div>

    <div id="patternDisplay">
        <div class="current-instruction" id="currentInst">Load a project to begin!</div>
        <div class="next-instruction" id="nextInst"></div>
        <div class="notes" id="currentNotes"></div>
    </div>

    <button id="doneBtn">Done With Row</button>
    
    <div class="action-row">
        <button id="undoBtn">Undo</button>
        <button id="viewerBtn">Pattern Viewer</button>
    </div>

    <div id="viewerPopup">
        <button id="closeViewerBtn" style="margin-bottom: 15px;">Close Viewer</button>
        <div id="viewerList"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzvnL7aKmTSiyslUG_j5YoDY0sXd1bhTt1lT06W73eqGAUD6wg8Jn7CeVt2g5OHjeLLUQ/exec";
        
        // --- STATE ---
        let projects = [];
        let currentProjectId = null;
        let currentRowIndex = 0;

        // --- DOM ELEMENTS ---
        const projectSelect = document.getElementById('projectSelect');
        const deleteBtn = document.getElementById('deleteBtn');
        const toggleImportBtn = document.getElementById('toggleImportBtn');
        const importSection = document.getElementById('importSection');
        const jsonInput = document.getElementById('jsonInput');
        const importBtn = document.getElementById('importBtn');
        const statusText = document.getElementById('statusText');
        
        const currentInstEl = document.getElementById('currentInst');
        const nextInstEl = document.getElementById('nextInst');
        const notesEl = document.getElementById('currentNotes');
        
        const doneBtn = document.getElementById('doneBtn');
        const undoBtn = document.getElementById('undoBtn');
        const viewerBtn = document.getElementById('viewerBtn');
        
        const viewerPopup = document.getElementById('viewerPopup');
        const viewerList = document.getElementById('viewerList');
        const closeViewerBtn = document.getElementById('closeViewerBtn');

        // --- INITIALIZATION ---
        function init() {
            loadLocalProjects();
            fetchProjectsFromCloud();
        }

        function loadLocalProjects() {
            const cached = localStorage.getItem('cachedProjects');
            if (cached) {
                projects = JSON.parse(cached);
                populateDropdown();
            }
        }

        // --- UI UPDATES ---
        function populateDropdown() {
            projectSelect.innerHTML = '';
            if (projects.length === 0) {
                projectSelect.innerHTML = '<option>No projects found</option>';
                currentInstEl.innerText = "Import a project to begin!";
                nextInstEl.innerText = "";
                return;
            }
            projects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.projectId;
                opt.innerText = p.projectName;
                projectSelect.appendChild(opt);
            });
            
            // Try to restore last selected
            const lastActive = localStorage.getItem('lastActiveProject');
            if (lastActive && projects.find(p => p.projectId === lastActive)) {
                projectSelect.value = lastActive;
                currentProjectId = lastActive;
            } else {
                currentProjectId = projects[0].projectId;
            }
            
            loadProjectProgress();
        }

        function updateDisplay() {
            if (!currentProjectId) return;
            const proj = projects.find(p => p.projectId === currentProjectId);
            if (!proj) return;

            if (currentRowIndex >= proj.totalRows) {
                currentInstEl.innerText = "Project Complete! 🎉";
                nextInstEl.innerText = "";
                notesEl.innerText = "";
                return;
            }

            const current = proj.pattern[currentRowIndex];
            const next = proj.pattern[currentRowIndex + 1];

            currentInstEl.innerText = `Row ${current.rowNumber}: ${current.instruction}`;
            notesEl.innerText = current.notes ? `Notes: ${current.notes}` : "";
            nextInstEl.innerText = next ? `Next: Row ${next.rowNumber} - ${next.instruction.substring(0, 30)}...` : "Next: Finish Project!";
        }

        // --- CORE LOGIC ---
        function loadProjectProgress() {
            if (!currentProjectId) return;
            const savedRow = localStorage.getItem(`${currentProjectId}_row`);
            currentRowIndex = savedRow ? parseInt(savedRow, 10) : 0;
            updateDisplay();
        }

        function saveProgress(newIndex) {
            if (!currentProjectId) return;
            const proj = projects.find(p => p.projectId === currentProjectId);
            if (newIndex < 0) newIndex = 0;
            if (newIndex > proj.totalRows) newIndex = proj.totalRows;
            
            currentRowIndex = newIndex;
            localStorage.setItem(`${currentProjectId}_row`, currentRowIndex);
            updateDisplay();
            syncProgressToCloud();
        }

        // --- GOOGLE SHEETS CLOUD SYNC ---
        function checkUrl() {
            if (GOOGLE_WEB_APP_URL.includes("PASTE_YOUR_COPIED_URL_HERE")) {
                alert("WARNING: The app is trying to sync, but the Google URL is missing!");
                return false;
            }
            return true;
        }

        function fetchProjectsFromCloud() {
            if (!checkUrl()) return;
            fetch(GOOGLE_WEB_APP_URL + "?action=getProjects")
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        projects = data;
                        localStorage.setItem('cachedProjects', JSON.stringify(projects));
                        populateDropdown();
                    }
                }).catch(err => console.log("Cloud fetch failed", err));
        }

        function syncProgressToCloud() {
            if (!checkUrl()) return;
            statusText.innerText = "Consulting the Purins...";
            fetch(GOOGLE_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "updateProgress",
                    projectId: currentProjectId,
                    currentRow: currentRowIndex,
                    timestamp: new Date().toISOString()
                })
            }).then(() => {
                statusText.innerText = "The Purins have aggreed!";
                setTimeout(() => statusText.innerText = "", 3000);
            }).catch(() => {
                statusText.innerText = "The Purins are asleep! (Offline mode)";
            });
        }

        function syncNewProjectToCloud(projectData) {
            if (!checkUrl()) return;
            statusText.innerText = "Consulting the Purins...";
            fetch(GOOGLE_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "addProject",
                    project: projectData
                })
            }).then(() => {
                statusText.innerText = "The Purins have aggreed!";
                setTimeout(() => statusText.innerText = "", 3000);
            });
        }
        
        function deleteProjectFromCloud(id) {
            if (!checkUrl()) return;
            fetch(GOOGLE_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "deleteProject",
                    projectId: id
                })
            });
        }

        // --- EVENT LISTENERS ---
        projectSelect.addEventListener('change', (e) => {
            currentProjectId = e.target.value;
            localStorage.setItem('lastActiveProject', currentProjectId);
            loadProjectProgress();
        });

        doneBtn.addEventListener('click', () => {
            saveProgress(currentRowIndex + 1);
        });

        undoBtn.addEventListener('click', () => {
            saveProgress(currentRowIndex - 1);
        });

        // Import Logic
        toggleImportBtn.addEventListener('click', () => {
            importSection.style.display = importSection.style.display === "none" ? "block" : "none";
        });

        importBtn.addEventListener('click', () => {
            try {
                const data = JSON.parse(jsonInput.value);
                if (!data.projectId || !data.projectName || !data.totalRows || !data.pattern) {
                    alert("Invalid JSON format! Missing required CustardCrochet keys.");
                    return;
                }
                // Save locally
                projects.push(data);
                localStorage.setItem('cachedProjects', JSON.stringify(projects));
                jsonInput.value = "";
                importSection.style.display = "none";
                populateDropdown();
                
                // Set as active
                projectSelect.value = data.projectId;
                currentProjectId = data.projectId;
                localStorage.setItem('lastActiveProject', currentProjectId);
                loadProjectProgress();
                
                // Sync to cloud
                syncNewProjectToCloud(data);
            } catch(e) {
                alert("Error reading JSON. Make sure it's properly formatted!");
            }
        });

        // Delete Logic
        deleteBtn.addEventListener('click', () => {
            if (!currentProjectId) return;
            if (confirm("Are you sure you want to delete this project?")) {
                projects = projects.filter(p => p.projectId !== currentProjectId);
                localStorage.setItem('cachedProjects', JSON.stringify(projects));
                localStorage.removeItem(`${currentProjectId}_row`);
                deleteProjectFromCloud(currentProjectId);
                populateDropdown();
            }
        });

        // Viewer Logic
        viewerBtn.addEventListener('click', () => {
            if (!currentProjectId) return;
            const proj = projects.find(p => p.projectId === currentProjectId);
            viewerList.innerHTML = '';
            
            proj.pattern.forEach((row, index) => {
                const div = document.createElement('div');
                div.className = 'viewer-row';
                if (index < currentRowIndex) div.classList.add('finished');
                else if (index === currentRowIndex) div.classList.add('current');
                else div.classList.add('future');
                
                div.innerText = `Row ${row.rowNumber}: ${row.instruction}`;
                div.addEventListener('click', () => {
                    saveProgress(index);
                    viewerPopup.style.display = 'none';
                });
                viewerList.appendChild(div);
            });
            viewerPopup.style.display = 'block';
        });

        closeViewerBtn.addEventListener('click', () => {
            viewerPopup.style.display = 'none';
        });

        // START
        init();
    </script>
</body>
</html>
