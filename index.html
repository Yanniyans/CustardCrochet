<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustardCrochet</title>
    <style>
        /* The Custom Crochet Palette */
        :root {
            --cream: #FEF6C1;
            --caramel: #986843;
            --dark-brown: #4B2D1B;
            --yellow: #F1D341;
            --orange: #EAA340;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            background-color: var(--cream); 
            color: var(--dark-brown); 
        }
        
        /* Header & Hopper */
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        select, button, textarea { padding: 10px; font-size: 16px; border-radius: 8px; border: 2px solid var(--caramel); color: var(--dark-brown); background-color: white; }
        select { flex: 1; font-weight: bold; cursor: pointer; }
        
        /* Delete Button */
        #delete-button { background-color: var(--dark-brown); color: var(--cream); border: none; cursor: pointer; font-weight: bold; width: 100px; }
        #delete-button:hover { background-color: #311d11; }
        
        /* Collapsible Sections & Menus */
        .collapsible-section { width: 100%; max-width: 400px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .toggle-btn { background-color: var(--yellow); border: 2px solid var(--caramel); cursor: pointer; font-weight: bold; }
        .toggle-btn:hover { filter: brightness(0.95); }
        
        .tool-panel { display: flex; flex-direction: column; gap: 10px; background: white; padding: 15px; border-radius: 12px; border: 2px solid var(--caramel); }
        textarea { resize: vertical; font-family: monospace; font-size: 14px; border: 2px solid var(--caramel); }
        .action-btn { background-color: var(--caramel); color: white; border: none; cursor: pointer; font-weight: bold; flex: 1;}
        .action-btn:hover { filter: brightness(0.9); }
        .btn-row { display: flex; gap: 10px; }
        
        /* Main Instruction Display */
        .instruction-box { width: 100%; max-width: 400px; background: white; padding: 30px 20px; border-radius: 12px; border: 2px solid var(--caramel); box-shadow: 0 4px 8px rgba(75, 45, 27, 0.15); text-align: center; margin-bottom: 30px; box-sizing: border-box; }
        #current-instruction { font-size: 24px; font-weight: bold; margin: 0; line-height: 1.4; color: var(--dark-brown); }
        
        /* Note Displays */
        .project-note { font-size: 14px; background: var(--yellow); padding: 8px; border-radius: 6px; margin-bottom: 15px; border: 1px dashed var(--caramel); text-align: left; }
        .row-note { font-size: 15px; font-style: italic; color: #666; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .note-label { font-weight: bold; color: var(--caramel); font-style: normal; display: block; margin-bottom: 3px; font-size: 12px; text-transform: uppercase; }

        /* Main Buttons */
        .button-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Tactile 3D Next Button */
        #next-button { 
            width: 100%; height: 150px; font-size: 28px; font-weight: bold; background-color: var(--orange); color: var(--dark-brown); border: 3px solid var(--dark-brown); border-radius: 20px; cursor: pointer; box-shadow: 0 8px 0px var(--dark-brown); transition: all 0.1s; 
        }
        #next-button:active { transform: translateY(8px); box-shadow: 0 0px 0px var(--dark-brown); }
        #next-button:disabled { background-color: #ccc; border-color: #999; color: #666; box-shadow: none; transform: none; cursor: not-allowed; }
        
        #undo-button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background-color: var(--yellow); color: var(--dark-brown); border: 2px solid var(--caramel); border-radius: 12px; cursor: pointer; }
        #undo-button:hover { filter: brightness(0.95); }
        #undo-button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Sync Status Note */
        .sync-status { text-align: center; font-size: 14px; font-style: italic; font-weight: bold; color: var(--caramel); margin: 0; min-height: 20px; }

        /* Pattern Overview */
        .all-instructions { width: 100%; text-align: left; background: white; padding: 15px; border-radius: 12px; border: 2px solid var(--caramel); box-sizing: border-box; }
        #instruction-list { list-style-type: none; padding: 0; margin: 0; }
        #instruction-list li { padding: 10px 12px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; border: 1px solid transparent; }
        #instruction-list li:hover { background-color: rgba(152, 104, 67, 0.1); border-color: rgba(152, 104, 67, 0.3); }
        #instruction-list li:active { transform: scale(0.98); }
        .done { text-decoration: line-through; opacity: 0.5; }
        .active-row { font-weight: bold; color: var(--orange); background-color: rgba(234, 163, 64, 0.1); border-color: var(--orange) !important; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <select id="project-hopper" onchange="switchProject()"></select>
        <button id="delete-button" onclick="deleteProject()">🗑️ Delete</button>
    </header>

    <div class="collapsible-section">
        <div class="btn-row">
            <button class="toggle-btn" onclick="toggleMenu('import-tools')">➕ Add Pattern</button>
            <button class="toggle-btn" onclick="toggleMenu('notes-tools')">📝 Manage Notes</button>
        </div>

        <div id="import-tools" class="tool-panel hidden">
            <textarea id="json-input" rows="4" placeholder="Paste your generated pattern JSON here..."></textarea>
            <button class="action-btn" onclick="importJson()">Import Pattern</button>
        </div>

        <div id="notes-tools" class="tool-panel hidden">
            <textarea id="note-input" rows="3" placeholder="Type a reminder or pattern adjustment here..."></textarea>
            <div class="btn-row">
                <button class="action-btn" onclick="saveNote('row')">Save to Current Row</button>
                <button class="action-btn" onclick="saveNote('project')">Save to Project</button>
            </div>
        </div>
    </div>

    <div class="instruction-box">
        <div id="current-project-note" class="project-note hidden"></div>
        <p id="current-instruction">Checking device memory...</p>
        <div id="current-row-note" class="row-note hidden"></div>
    </div>

    <div class="button-group">
        <button id="next-button" onclick="nextRow()" disabled>Next Row</button>
        <button id="undo-button" onclick="undoRow()" disabled>Undo Previous Row</button>
        <p id="sync-status" class="sync-status"></p>
    </div>

    <div class="collapsible-section" style="margin-top: 20px;">
        <button id="overview-toggle-btn" class="toggle-btn" onclick="toggleMenu('overview-container')">📜 View Pattern Overview</button>
        <div id="overview-container" class="all-instructions hidden">
            <ul id="instruction-list"></ul>
        </div>
    </div>

    <script>
        // PASTE YOUR GOOGLE SHEETS WEB APP URL HERE
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRxxoNcpP5f6UIe4jeZziYAb39urxZcv6QKBYSrbeGK4emsaMhmcJ2ihLsDT9xzqHDIw/exec";

        let allProjects = [];
        let allProgress = {};
        let activeProject = null;
        let currentRowIndex = 0;
        let historyStack = [];

        // Ensure progress object is formatted correctly
        function getProgressObj(id) {
            if (!allProgress[id]) {
                allProgress[id] = { currentRow: 0, projectNotes: "", rowNotes: {} };
            } else if (typeof allProgress[id] === 'number') {
                allProgress[id] = { currentRow: allProgress[id], projectNotes: "", rowNotes: {} };
            }
            return allProgress[id];
        }

        function saveToLocalMemory() {
            localStorage.setItem("custardProjects", JSON.stringify(allProjects));
            localStorage.setItem("custardProgress", JSON.stringify(allProgress));
        }

        async function initApp() {
            const cachedProjects = localStorage.getItem("custardProjects");
            const cachedProgress = localStorage.getItem("custardProgress");

            if (cachedProjects && cachedProgress) {
                allProjects = JSON.parse(cachedProjects);
                allProgress = JSON.parse(cachedProgress);
                populateHopper();
                setSyncStatus("Loaded locally. Checking purins...");
            } else {
                document.getElementById("current-instruction").innerText = "Fetching your projects from Google Sheets for the first time...";
            }

            try {
                const response = await fetch(GOOGLE_WEB_APP_URL);
                const data = await response.json();
                allProjects = data.projects;
                allProgress = data.progress;
                
                saveToLocalMemory();
                populateHopper(); 
                setSyncStatus("Sync complete!");
            } catch (error) {
                if (!cachedProjects) {
                    document.getElementById("current-instruction").innerText = "Could not connect to Google Sheets.";
                } else {
                    setSyncStatus("Offline mode. Using local data.");
                }
            }
        }

        function populateHopper() {
            const hopper = document.getElementById("project-hopper");
            hopper.innerHTML = "";
            if (allProjects.length === 0) {
                hopper.innerHTML = "<option>No Projects Found</option>";
                document.getElementById("current-instruction").innerText = "Tap 'Add Pattern' to get started!";
                document.getElementById("delete-button").disabled = true;
                document.getElementById("next-button").disabled = true;
                return;
            }
            document.getElementById("delete-button").disabled = false;
            allProjects.forEach(proj => {
                let opt = document.createElement("option");
                opt.value = proj.projectId;
                opt.innerText = proj.projectName;
                hopper.appendChild(opt);
            });
            switchProject(); 
        }

        function switchProject() {
            const hopper = document.getElementById("project-hopper");
            activeProject = allProjects.find(p => p.projectId === hopper.value);
            if (!activeProject) return;
            
            const pData = getProgressObj(activeProject.projectId);
            currentRowIndex = pData.currentRow || 0;
            historyStack = []; 
            document.getElementById("next-button").disabled = false;
            renderUI();
        }

        function renderUI() {
            if (!activeProject) return;
            const pData = getProgressObj(activeProject.projectId);
            
            // 1. Instruction Text
            const currentInst = activeProject.instructions[currentRowIndex] || "🎉 Project Complete!";
            document.getElementById("current-instruction").innerText = currentInst;

            // 2. Project Notes Logic
            const jsonProjNote = activeProject.projectNote || "";
            const userProjNote = pData.projectNotes || "";
            let finalProjNote = "";
            if (jsonProjNote) finalProjNote += `<span class='note-label'>Pattern Note:</span> ${jsonProjNote}<br><br>`;
            if (userProjNote) finalProjNote += `<span class='note-label'>My Note:</span> ${userProjNote}`;
            
            const projNoteEl = document.getElementById("current-project-note");
            projNoteEl.innerHTML = finalProjNote.trim();
            projNoteEl.classList.toggle("hidden", finalProjNote.trim() === "");

            // 3. Row Notes Logic
            const jsonRowNote = activeProject.rowNotes ? activeProject.rowNotes[currentRowIndex] : null;
            const userRowNote = pData.rowNotes ? pData.rowNotes[currentRowIndex] : null;
            let finalRowNote = "";
            if (jsonRowNote) finalRowNote += `<span class='note-label'>Pattern Note:</span> ${jsonRowNote}<br><br>`;
            if (userRowNote) finalRowNote += `<span class='note-label'>My Note:</span> ${userRowNote}`;
            
            const rowNoteEl = document.getElementById("current-row-note");
            rowNoteEl.innerHTML = finalRowNote.trim();
            rowNoteEl.classList.toggle("hidden", finalRowNote.trim() === "");

            // 4. Pattern Overview List
            const listEl = document.getElementById("instruction-list");
            listEl.innerHTML = "";
            activeProject.instructions.forEach((inst, index) => {
                const li = document.createElement("li");
                li.innerText = inst;
                li.onclick = () => jumpToRow(index);
                
                if (index < currentRowIndex) li.className = "done";
                if (index === currentRowIndex) li.classList.add("active-row");
                
                listEl.appendChild(li);
            });

            document.getElementById("undo-button").disabled = (historyStack.length === 0);
        }

        function setSyncStatus(message) {
            const statusEl = document.getElementById("sync-status");
            statusEl.innerText = message;
            if (message === "The purins have agreed!" || message === "Sync complete!" || message === "Notes updated!") {
                setTimeout(() => { if (statusEl.innerText === message) statusEl.innerText = ""; }, 2000);
            }
        }

        function syncProgressToSheets(pData) {
            fetch(GOOGLE_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ 
                    action: "updateProgress", 
                    projectId: activeProject.projectId, 
                    newRow: pData.currentRow,
                    projectNotes: pData.projectNotes,
                    rowNotes: pData.rowNotes
                })
            })
            .then(response => response.json())
            .then(result => { if (result.status === "saved") setSyncStatus("The purins have agreed!"); })
            .catch(error => { setSyncStatus("Offline mode - Saved locally!"); });
        }

        function nextRow() {
            if (currentRowIndex < activeProject.instructions.length) {
                historyStack.push(currentRowIndex);
                currentRowIndex++;
                
                const pData = getProgressObj(activeProject.projectId);
                pData.currentRow = currentRowIndex;
                
                saveToLocalMemory(); 
                renderUI(); 
                setSyncStatus("Consulting the purins..."); 
                syncProgressToSheets(pData);
            }
        }

        function undoRow() {
            if (historyStack.length > 0) {
                currentRowIndex = historyStack.pop();
                
                const pData = getProgressObj(activeProject.projectId);
                pData.currentRow = currentRowIndex;
                
                saveToLocalMemory(); 
                renderUI();
                setSyncStatus("Consulting the purins...");
                syncProgressToSheets(pData);
            }
        }

        function jumpToRow(targetIndex) {
            if (targetIndex === currentRowIndex) return;
            historyStack.push(currentRowIndex); 
            currentRowIndex = targetIndex;
            
            const pData = getProgressObj(activeProject.projectId);
            pData.currentRow = currentRowIndex;
            
            saveToLocalMemory();
            renderUI();
            setSyncStatus("Consulting the purins...");
            syncProgressToSheets(pData);
        }

        // New Note Logic
        function saveNote(type) {
            const inputField = document.getElementById("note-input");
            const noteText = inputField.value.trim();
            if (!activeProject) return;

            const pData = getProgressObj(activeProject.projectId);

            if (type === 'project') {
                pData.projectNotes = noteText;
            } else if (type === 'row') {
                if (noteText === "") {
                    delete pData.rowNotes[currentRowIndex];
                } else {
                    pData.rowNotes[currentRowIndex] = noteText;
                }
            }

            saveToLocalMemory();
            renderUI();
            
            inputField.value = "";
            toggleMenu('notes-tools'); // Hide menu after saving
            
            setSyncStatus("Syncing notes to purins...");
            syncProgressToSheets(pData);
        }

        // Universal Menu Toggle
        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            menu.classList.toggle("hidden");
            
            if(menuId === "overview-container") {
                const btn = document.getElementById("overview-toggle-btn");
                btn.innerText = menu.classList.contains("hidden") ? "📜 View Pattern Overview" : "Hide Pattern Overview";
            }
        }

        async function importJson() {
            const inputField = document.getElementById("json-input");
            const jsonText = inputField.value.trim();
            if (!jsonText) { alert("Please paste the JSON code first!"); return; }

            try {
                const newProject = JSON.parse(jsonText);
                
                allProjects.push(newProject);
                saveToLocalMemory();
                populateHopper();
                document.getElementById("project-hopper").value = newProject.projectId;
                switchProject();
                inputField.value = ""; 
                toggleMenu('import-tools'); 

                setSyncStatus("Sending pattern to the purins...");
                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "addProject", ...newProject })
                });
                
                const result = await response.json();
                if(result.status === "project_added") setSyncStatus("The purins have accepted your pattern!");

            } catch (err) {
                alert("Oops! The text you pasted isn't valid JSON, or there was a connection error.");
            }
        }

        async function deleteProject() {
            if (!activeProject) return;
            
            const confirmDelete = confirm(`Are you sure you want to permanently delete "${activeProject.projectName}"?`);
            if (!confirmDelete) return;
            
            allProjects = allProjects.filter(p => p.projectId !== activeProject.projectId);
            delete allProgress[activeProject.projectId];
            saveToLocalMemory();
            populateHopper(); 

            setSyncStatus("Asking purins to delete...");

            try {
                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "deleteProject", projectId: activeProject.projectId })
                });
                const result = await response.json();
                if(result.status === "project_deleted") setSyncStatus("Deleted!");
            } catch (err) {
                alert("Failed to delete the project from Google Sheets. It may reappear on other devices.");
            }
        }

        initApp();
    </script>
</body>
</html>
